name: lint
# pull_request is what covers a PR from a fork: its pushes land in the fork,
# so they never trigger anything here. push is narrowed to v1 so a same-repo
# PR does not run this twice.
on:
  push:
    branches:
      - v1
  pull_request:
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
      - uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
      - name: Run go vet
        run: |
          go vet ./...
      # AUTODOC_DRYRUN makes this report drift without writing anything or
      # touching git.
      - name: Check documentation generator
        run: |
          find . -name '*.md' | xargs env AUTODOC_DRYRUN=1 perl tools/autodoc.pl
